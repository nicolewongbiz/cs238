[project]
name = "rover"
version = "0.1.0"
description = "Risk-aware scientific exploration on Mars (CS238/AA228 final project)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
